<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pembuat Invoice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Mulish:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<script>addEventListener("error",function(e){var d=document.createElement("div");d.style.cssText="position:fixed;left:0;right:0;top:0;background:#b00;color:#fff;padding:8px;font:13px sans-serif;z-index:9";d.textContent="Error: "+e.message;(document.body||document.documentElement).appendChild(d)})</script>
<style>
:root{--bg:#f2f2f0;--card:#fff;--ink:#1c1717;--mut:#6b6666;--line:#d8d6d3;--acc:#c8322d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1919;--card:#262323;--ink:#f1eeee;--mut:#a39d9d;--line:#3b3636}}
:root[data-theme="dark"]{--bg:#1b1919;--card:#262323;--ink:#f1eeee;--mut:#a39d9d;--line:#3b3636}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Mulish,system-ui,sans-serif}
.app{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:20px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
@media(max-width:860px){.app{grid-template-columns:1fr}}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
h1{font-size:18px;margin:0}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mut)}
input,textarea{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{flex:1}
.auto:empty{display:none}.auto{font-size:13px;color:var(--mut);background:var(--bg);border-radius:8px;padding:8px 10px}
#wrap{overflow:hidden}
#inv{width:794px;height:1123px;background:#fff;color:#1c1717;position:relative;transform-origin:top left;font-family:Mulish,sans-serif;box-shadow:0 1px 8px rgba(0,0,0,.2)}
#inv .a{position:absolute}
.hd{left:48px;top:100px;width:470px;height:190px;background:#a6a6a6;clip-path:polygon(0 0,86% 0,100% 50%,94% 100%,0 100%);border-radius:36px 0 0 0}
.strip{left:48px;top:200px;width:22px;height:150px;background:#a6a6a6;border-radius:0 0 0 22px}
.hd b{position:absolute;left:40px;top:62px;font:400 78px/1 'Abril Fatface',serif;letter-spacing:2px}
.logo{right:50px;top:95px;width:290px;height:120px;object-fit:contain;object-position:right center}
.logot{right:50px;top:110px;width:290px;font:800 62px/.95 Mulish;color:#d33;letter-spacing:-2px;text-align:right}
.meta{left:84px;top:305px;font-size:17px;line-height:30px;display:grid;grid-template-columns:130px auto}
.kep{right:50px;top:305px;text-align:right;font-size:17px;line-height:1.15;max-width:260px}
.kep b{display:block;font-size:20px;margin-bottom:12px}
.th,.tr{left:86px;width:625px;display:grid;grid-template-columns:1fr 170px 150px;align-items:center}
.th{top:410px;height:56px;background:#a6a6a6;font-weight:800;font-size:16px}
.tr{font-size:17px}
.th span,.tr span{padding:0 10px}
.th span:first-child,.tr span:first-child{padding-left:46px}
.th span:nth-child(2),.tr span:nth-child(2){text-align:center}
.th span:last-child,.tr span:last-child{text-align:right;padding-right:34px}
.ln{left:86px;width:625px;border-top:1.5px solid #1c1717}
.tot{left:90px;width:620px;font-size:17px}
.tot div{display:grid;grid-template-columns:1fr 150px;height:27px;line-height:27px}
.tot b{font-weight:800}.tot i{font-style:normal;text-align:right;padding-right:6px}
.box{outline:1px solid #1c1717;outline-offset:1px;justify-self:end;padding:0 6px;margin-right:0}
.syr{left:90px;top:700px;font-size:16px;line-height:23px;width:560px}
.syr h4{margin:0 0 10px;font-size:17px;font-weight:800}
.syr ol{margin:0;padding-left:26px}
.cp{left:68px;bottom:80px;font-size:16px}.cp b{display:block;margin-top:14px;font-size:17px}
.sig{right:50px;bottom:70px;width:300px;text-align:center;font-size:21px}
.sig img{display:block;margin:0 auto 4px;max-height:100px;max-width:220px}
@media print{@page{size:A4;margin:0}body{background:#fff}form,.noprint{display:none!important}.app{display:block;padding:0}#wrap{height:auto!important}#inv{transform:none!important;box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<form id="f" onsubmit="return false">
<h1>Pembuat Invoice</h1>
<div class="auto" id="autoInfo"></div>
<label>Nomor referensi<input id="ref" value="INV/2026/0001"></label>
<label>Due date<input id="due" type="date"></label>
<label>Kepada<textarea id="kep" rows="2">PT BRATU SALAMAH PRODUCTION</textarea></label>
<div id="items" style="display:grid;gap:8px"></div>
<button type="button" id="add">+ Tambah keterangan</button>
<div class="auto">Sub total: <b id="stInfo"></b></div>
<label>DP terbayar (Rp)<input id="dp" inputmode="numeric" value="1.500.000"></label>
<div class="auto">Sisa pelunasan: <b id="sisaInfo"></b></div>
<label>Syarat dan ketentuan (satu baris = satu poin)<textarea id="syr" rows="4">Pembayaran Dp sebesar 50%
Transaksi pembayaran hanya melalui rekening BNI 1535830855 An/ Arya Prasetio Widodo</textarea></label>
<label>Nomor CP<input id="cp" value="082334525296"></label>
<label>Nama penandatangan<input id="ttd" value="Harjoo widodo"></label>
<label>Logo (opsional)<input id="logo" type="file" accept="image/*"></label>
<label>Gambar tanda tangan (opsional)<input id="sig" type="file" accept="image/*"></label>
<div class="btns"><button type="button" class="pri" id="pdf">Unduh PDF</button><button type="button" id="png">Unduh PNG</button></div><div class="auto" id="msg" role="status"></div>
</form>
<div id="wrap"><div id="inv"><p style="padding:40px;font:16px sans-serif">Memuat invoice...</p></div></div>
<noscript><p style="padding:16px">Aktifkan JavaScript atau buka file ini di browser (Safari/Chrome), bukan di pratinjau file.</p></noscript>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const rp=n=>new Intl.NumberFormat('id-ID').format(n||0);
const num=s=>parseInt(String(s).replace(/\D/g,''))||0;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const today=new Date();
const tgl=today.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
let items=[{k:'Mejig Massrum',t:'24 Oktober',r:'3.500.000'}];
let logoURL='',sigURL='';
const d=new Date(today);d.setMonth(d.getMonth()+1);
$('due').value=d.toISOString().slice(0,10);
$('autoInfo').textContent='Tanggal otomatis: '+tgl;

function dueFmt(){const v=$('due').value;if(!v)return'-';const[y,m,dd]=v.split('-');return dd+'/'+m+'/'+y}
function buildItems(){
  const box=$('items');box.innerHTML='';
  items.forEach((it,i)=>{
    const el=document.createElement('div');el.className='item';
    el.innerHTML=`<label>Keterangan<input data-f="k" value="${esc(it.k)}"></label>
    <div class="row2"><label>Tanggal<input data-f="t" value="${esc(it.t)}"></label>
    <label>Rate (Rp)<input data-f="r" inputmode="numeric" value="${esc(it.r)}"></label></div>
    ${items.length>1?'<button type="button" data-del>Hapus</button>':''}`;
    el.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{
      if(inp.dataset.f==='r'){const n=num(inp.value);inp.value=n?rp(n):''}
      it[inp.dataset.f]=inp.value;render();
    }));
    const del=el.querySelector('[data-del]');
    if(del)del.onclick=()=>{items.splice(i,1);buildItems();render()};
    box.appendChild(el);
  });
}
function render(){
  const sub=items.reduce((s,x)=>s+num(x.r),0);
  const dp=num($('dp').value),sisa=sub-dp;
  $('stInfo').textContent='Rp '+rp(sub);$('sisaInfo').textContent='Rp '+rp(sisa);
  const rows=items.map((x,i)=>{const y=i*44;return `<div class="a tr" style="top:${486+y}px;height:44px"><span>${esc(x.k)}</span><span>${esc(x.t)}</span><span>${rp(num(x.r))}</span></div>`}).join('');
  const endY=486+items.length*44+14;
  const syr=$('syr').value.split('\n').filter(s=>s.trim()).map(s=>`<li>${esc(s)}</li>`).join('');
  const logo=logoURL?`<img class="a logo" src="${logoURL}">`:`<div class="a logot">MEJIG<br>MASSRUM</div>`;
  $('inv').innerHTML=`<div class="a strip"></div><div class="a hd"><b>INVOICE</b></div>${logo}
  <div class="a meta"><span>Referensi</span><span>${esc($('ref').value)}</span><span>Tanggal</span><span>${tgl}</span><span>Due Date</span><span>${dueFmt()}</span></div>
  <div class="a kep"><b>KEPADA :</b>${esc($('kep').value).replace(/\n/g,'<br>')}</div>
  <div class="a th"><span>KETERANGAN</span><span>TANGGAL</span><span>RATE</span></div>
  ${rows}<div class="a ln" style="top:${endY}px"></div><div class="a ln" style="top:${endY+70}px"></div>
  <div class="a tot" style="top:${endY+82}px">
   <div><b>SUB TOTAL :</b><i>${rp(sub)}</i></div>
   <div><b>DP TERBAYAR :</b><i>${rp(dp)}</i></div>
   <div><b>SISA PELUNASAN :</b><i><span class="box">${rp(sisa)}</span></i></div></div>
  <div class="a syr" style="top:${Math.max(endY+210,700)}px"><h4>SYARAT DAN KETENTUAN</h4><ol>${syr}</ol></div>
  <div class="a cp">CP ${esc($('cp').value)}<b>THANK YOU</b></div>
  <div class="a sig">${sigURL?`<img src="${sigURL}">`:'<div style="height:104px"></div>'}${esc($('ttd').value)}</div>`;
  fit();
}
function fit(){
  const w=$('wrap').clientWidth,s=Math.min(1,w/794);
  $('inv').style.transform='scale('+s+')';$('wrap').style.height=(1123*s)+'px';
}
['ref','due','kep','syr','cp','ttd'].forEach(id=>$(id).addEventListener('input',render));
$('dp').addEventListener('input',e=>{const n=num(e.target.value);e.target.value=n?rp(n):'';render()});
$('add').onclick=()=>{items.push({k:'',t:'',r:''});buildItems();render()};
function readImg(id,cb){$(id).addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cb(r.result);render()};r.readAsDataURL(f)})}
readImg('logo',u=>logoURL=u);readImg('sig',u=>sigURL=u);
function loadLib(src,ok){return new Promise((res,rej)=>{if(ok())return res();const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('lib'));document.head.appendChild(t)})}
async function shot(){
  await loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);
  return html2canvas($('inv'),{scale:2,backgroundColor:'#fff',onclone:doc=>{doc.getElementById('inv').style.transform='none'}});
}
async function save(filename,data){
  let dl=null;
  try{dl=await claude.use('downloads')}catch(e){}
  if(dl){
    try{await dl.save({filename,data});return}catch(e){if(e&&e.code==='declined')return;msg('Gagal menyimpan: '+(e&&e.message||e.code));return}
  }
  const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));
  const a=document.createElement('a');a.href=u;a.download=filename;a.click();
}
function msg(t){const m=$('msg');m.textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>m.textContent='',5000)}
const fname=ext=>'invoice-'+$('ref').value.replace(/\W+/g,'-')+'.'+ext;
$('png').onclick=async()=>{
  try{
    msg('Membuat PNG...');
    const c=await shot();
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    await save(fname('png'),blob);msg('');
  }catch(e){msg('Gagal membuat PNG.')}
};
$('pdf').onclick=async()=>{
  try{
    msg('Membuat PDF...');
    const c=await shot();
    await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'px',format:[794,1123],hotfixes:['px_scaling']});
    pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,794,1123);
    await save(fname('pdf'),pdf.output('blob'));msg('');
  }catch(e){msg('Gagal membuat PDF.')}
};
window.addEventListener('resize',fit);
try{buildItems();render()}catch(e){msg('Error: '+(e&&e.message||e))}
window.addEventListener('error',e=>msg('Error: '+e.message));
})();
</script>
</body>
</html>
